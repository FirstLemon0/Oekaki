  <text x="190" y="42" font-size="19" fill="currentColor" stroke="none" text-anchor="middle" font-weight="700">手首</text>
  <text x="430" y="42" font-size="19" fill="currentColor" stroke="none" text-anchor="middle" font-weight="700">膝</text>
  <text x="670" y="42" font-size="19" fill="currentColor" stroke="none" text-anchor="middle" font-weight="700">足首</text>
  <text x="190" y="446" font-size="16" fill="#7BB661" stroke="none" text-anchor="middle">手の先まで入れる</text>
  <text x="430" y="446" font-size="16" fill="#7BB661" stroke="none" text-anchor="middle">関節の間（太もも）で切る</text>
  <text x="670" y="446" font-size="16" fill="#7BB661" stroke="none" text-anchor="middle">足の先まで入れる</text>
  <text x="400" y="242" font-size="16" fill="currentColor" stroke="none" text-anchor="middle">緑の丸：枠の線が関節にちょうど重なっている</text>
  <text x="400" y="482" font-size="19" fill="currentColor" stroke="none" text-anchor="middle">手首・膝・足首で画面を切らない。切るなら関節と関節の間で</text>
