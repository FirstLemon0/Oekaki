  <text x="620" y="330" font-size="18" fill="currentColor" stroke="none" text-anchor="middle">目より下の線は</text>
  <text x="620" y="358" font-size="18" fill="currentColor" stroke="none" text-anchor="middle">上がって消失点へ</text>
  <text x="400" y="475" font-size="20" fill="currentColor" stroke="none" text-anchor="middle">平行な線は、遠くで1点（消失点）に集まって見える</text>
