  <text x="75" y="205" font-size="18" fill="currentColor" stroke="none" text-anchor="middle">（卵）</text>
  <text x="75" y="330" font-size="22" fill="currentColor" stroke="none" text-anchor="middle">骨盤</text>
  <text x="75" y="355" font-size="18" fill="currentColor" stroke="none" text-anchor="middle">（箱）</text>
  <text x="200" y="460" font-size="22" fill="currentColor" stroke="none" text-anchor="middle">正面：背骨はまっすぐ</text>
  <ellipse cx="510" cy="175" rx="55" ry="88" transform="rotate(12 510 175)"/>
