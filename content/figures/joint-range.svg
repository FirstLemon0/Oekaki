<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="Zen Kaku Gothic New, sans-serif">
  <circle cx="200" cy="200" r="7" fill="currentColor" stroke="none"/>
  <line x1="120" y1="200" x2="200" y2="200" stroke-width="6"/>
  <line x1="200" y1="200" x2="280" y2="200" stroke-width="3" opacity="0.4"/>
  <line x1="200" y1="200" x2="215" y2="110" stroke-width="3" opacity="0.4"/>
  <path d="M270,200 A70,70 0 0 0 212,131" stroke="#7BB661" stroke-width="3"/>
  <text x="200" y="290" font-size="18" fill="currentColor" stroke="none" text-anchor="middle">ひじ：一方向に曲がる</text>
  <text x="200" y="316" font-size="16" fill="currentColor" stroke="none" text-anchor="middle">（反対には曲がらない）</text>
  <circle cx="400" cy="150" r="7" fill="currentColor" stroke="none"/>
  <line x1="400" y1="80" x2="400" y2="150" stroke-width="6"/>
  <line x1="400" y1="150" x2="400" y2="240" stroke-width="3" opacity="0.4"/>
  <line x1="400" y1="150" x2="330" y2="205" stroke-width="3" opacity="0.4"/>
  <path d="M400,225 A75,75 0 0 1 338,195" stroke="#7BB661" stroke-width="3"/>
  <text x="400" y="290" font-size="18" fill="currentColor" stroke="none" text-anchor="middle">ひざ：後ろにだけ曲がる</text>
  <circle cx="620" cy="180" r="7" fill="currentColor" stroke="none"/>
  <circle cx="620" cy="180" r="90" stroke="#7BB661" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="620" y1="180" x2="690" y2="125" stroke-width="4"/>
  <line x1="620" y1="180" x2="560" y2="250" stroke-width="3" opacity="0.4"/>
  <text x="620" y="310" font-size="18" fill="currentColor" stroke="none" text-anchor="middle">肩：ぐるりと回る</text>
  <text x="400" y="475" font-size="20" fill="currentColor" stroke="none" text-anchor="middle">関節ごとに曲がる向きが決まっている。迷ったら自分の体で確かめる</text>
