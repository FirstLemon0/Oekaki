  <text x="220" y="420" font-size="19" fill="#7BB661" stroke="none" text-anchor="middle">影の境目はくっきり</text>
  <text x="420" y="110" font-size="18" fill="currentColor" stroke="none" text-anchor="start">① ベタの上に影用レイヤーを作る</text>
