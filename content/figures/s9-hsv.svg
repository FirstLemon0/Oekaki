<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="Zen Kaku Gothic New, sans-serif">
  <circle cx="150" cy="130" r="18" fill="hsl(0,80%,55%)" stroke="none"/>
  <circle cx="195" cy="142.1" r="18" fill="hsl(30,80%,55%)" stroke="none"/>
  <circle cx="227.9" cy="175" r="18" fill="hsl(60,80%,55%)" stroke="none"/>
  <circle cx="240" cy="220" r="18" fill="hsl(90,80%,55%)" stroke="none"/>
  <circle cx="227.9" cy="265" r="18" fill="hsl(120,80%,55%)" stroke="none"/>
  <circle cx="195" cy="297.9" r="18" fill="hsl(150,80%,55%)" stroke="none"/>
  <circle cx="150" cy="310" r="18" fill="hsl(180,80%,55%)" stroke="none"/>
